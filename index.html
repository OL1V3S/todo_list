<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Page settings and styles -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>To-Do List</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <main class="container">
            <!-- App title -->
            <header>
                <h1>To-Do List</h1>
            </header>

            <!-- New task form -->
            <form id="task-form" class="input-section">
                <label class="sr-only" for="task-input">New task</label>
                <input
                    type="text"
                    id="task-input"
                    placeholder="Type a new task"
                    maxlength="120"
                    autocomplete="off"
                />
                <button id="add-task-btn" type="submit">Add task</button>
            </form>

            <!-- Task filter controls -->
            <div class="filters" role="group" aria-label="Filter tasks">
                <button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">All</button>
                <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">Active</button>
                <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">Completed</button>
            </div>

            <!-- JavaScript adds tasks to this list -->
            <p id="empty-message" class="empty-message">No tasks yet. Add one above.</p>
            <ul id="task-list" aria-live="polite"></ul>

            <!-- Task summary and cleanup action -->
            <footer class="task-footer">
                <span id="task-count">0 tasks left</span>
                <button id="clear-completed-btn" type="button">Delete completed</button>
            </footer>
        </main>

        <!-- Falling leaves (added by script.js) -->
        <div class="leaves" aria-hidden="true"></div>

        <!-- Load JavaScript after the page elements exist -->
        <script src="script.js"></script>
    </body>
</html>
